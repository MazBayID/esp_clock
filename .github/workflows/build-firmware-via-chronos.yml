name: Build NEO CLOCK - via Chronos BLE

on:
  push:
    branches:
      - main
      - feature/via-chronos-ble
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      gpio_config:
        description: 'JSON object with supported GPIO signal-to-pin assignments'
        required: false
        type: string
        default: '{}'
      build_id:
        description: 'Firmware Builder request UUID (leave empty for manual builds)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: neo-clock-chronos-build-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-esp32-c3:
    name: Build NEO CLOCK - ESP32-C3 SuperMini (BLE)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and apply GPIO configuration
        env:
          GPIO_CONFIG_JSON: ${{ inputs.gpio_config || '{}' }}
        run: |
          python tools/configure_gpio.py --variant via_chronos
          python -m unittest discover -s tests -v

      - name: Notify Firmware Builder that build started
        if: ${{ inputs.build_id != '' }}
        continue-on-error: true
        env:
          CALLBACK_URL: https://ymjhfaplponxbjhpvhuq.supabase.co/functions/v1/firmware-build-callback
          CALLBACK_SECRET: ${{ secrets.FIRMWARE_BUILDER_CALLBACK_SECRET }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          if [ -z "$CALLBACK_SECRET" ]; then
            echo "::warning::Firmware Builder callback secret is not configured"
            exit 0
          fi
          payload="$(python -c 'import json,os; print(json.dumps({"event":"started","build_id":os.environ["BUILD_ID"],"run_id":int(os.environ["GITHUB_RUN_ID"]),"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"source_commit_sha":os.environ["GITHUB_SHA"]}))')"
          curl --fail-with-body --silent --show-error -X POST "$CALLBACK_URL" \
            -H "Authorization: Bearer $CALLBACK_SECRET" \
            -H "Content-Type: application/json" \
            -d "$payload"

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install asset processing dependency
        run: python -m pip install Pillow

      - name: Generate NEO CLOCK UI assets
        run: python tools/process_assets.py firmware/via_chronos/src/assets/generated/ui_assets.h

      - name: Install ESP32 platform
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install Arduino libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "ChronosESP32"
          arduino-cli lib install "ESP32Time"
          arduino-cli lib install "NimBLE-Arduino"

      - name: Compile NEO CLOCK via Chronos
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32c3 --warnings all --output-dir build/neo-clock-chronos firmware/via_chronos

      - name: Package standardized firmware downloads
        env:
          BUILD_ID: ${{ inputs.build_id || '' }}
        run: |
          python tools/package_firmware.py \
            --variant via_chronos \
            --build-dir build/neo-clock-chronos \
            --output-dir dist/via_chronos \
            --git-sha "$GITHUB_SHA" \
            --build-id "$BUILD_ID"

      - name: Upload firmware package
        id: upload_package
        uses: actions/upload-artifact@v4
        with:
          name: neo-clock-via-chronos-${{ github.sha }}
          path: dist/via_chronos/*
          if-no-files-found: error
          retention-days: 30

      - name: Report Firmware Builder completion
        if: ${{ always() && inputs.build_id != '' }}
        continue-on-error: true
        env:
          CALLBACK_URL: https://ymjhfaplponxbjhpvhuq.supabase.co/functions/v1/firmware-build-callback
          CALLBACK_SECRET: ${{ secrets.FIRMWARE_BUILDER_CALLBACK_SECRET }}
          BUILD_ID: ${{ inputs.build_id }}
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.upload_package.outputs.artifact-id }}
        run: |
          if [ -z "$CALLBACK_SECRET" ]; then
            echo "::warning::Firmware Builder callback secret is not configured"
            exit 0
          fi
          payload="$(python -c 'import json,os; print(json.dumps({"event":"completed","build_id":os.environ["BUILD_ID"],"run_id":int(os.environ["GITHUB_RUN_ID"]),"run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"artifact_id":int(os.environ["ARTIFACT_ID"]) if os.environ.get("ARTIFACT_ID") else None,"job_status":os.environ["JOB_STATUS"],"source_commit_sha":os.environ["GITHUB_SHA"]}))')"
          curl --fail-with-body --silent --show-error -X POST "$CALLBACK_URL" \
            -H "Authorization: Bearer $CALLBACK_SECRET" \
            -H "Content-Type: application/json" \
            -d "$payload"
