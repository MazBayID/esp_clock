name: Build NEO CLOCK - ESP32-C3

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neo-clock-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-esp32-c3:
    name: Build NEO CLOCK - ESP32-C3 SuperMini
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 platform
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install Arduino libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "ArduinoJson"

      - name: Install asset processing dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate optimized monochrome UI bitmaps
        run: python tools/process_assets.py

      - name: Compile NEO CLOCK firmware
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32c3 --warnings all --output-dir build/neo-clock firmware/via_wifi

      - name: Package firmware binaries
        run: |
          mkdir -p dist
          cp build/neo-clock/*.bin dist/
          cat > dist/FLASH-INSTRUCTIONS.txt <<'EOF'
          NEO CLOCK - ESP32-C3 SuperMini

          Default ESP32-C3 Arduino flash offsets:
            bootloader  : 0x0000
            partitions  : 0x8000
            boot_app0   : 0xE000
            application : 0x10000

          Use an ESP32 flashing tool and match each binary to its offset.
          Select the ESP32-C3 target and the serial port for your board.
          EOF
          cd dist
          zip -9 "../NEO-CLOCK-ESP32-C3-${GITHUB_SHA::7}.zip" ./*.bin FLASH-INSTRUCTIONS.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEO-CLOCK-ESP32-C3-${{ github.sha }}
          path: NEO-CLOCK-ESP32-C3-*.zip
          if-no-files-found: error
          retention-days: 30
