name: Build Mochi Chronos Firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/mochi_chronos/**"
      - "tools/package_firmware.py"
      - "tools/configure_gpio.py"
      - "tests/test_configure_gpio.py"
      - ".github/workflows/build-firmware-mochi-chronos.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/mochi_chronos/**"
      - "tools/package_firmware.py"
      - ".github/workflows/build-firmware-mochi-chronos.yml"
  workflow_dispatch:
    inputs:
      gpio_config:
        description: 'JSON object with supported GPIO signal-to-pin assignments'
        required: false
        type: string
        default: '{}'
      build_id:
        description: 'Firmware Builder request UUID (leave empty for manual builds)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: neo-clock-mochi-build-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and apply GPIO configuration
        env:
          GPIO_CONFIG_JSON: ${{ inputs.gpio_config || '{}' }}
        run: |
          python tools/configure_gpio.py --variant mochi_chronos
          python -m unittest discover -s tests -v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install platformio pillow esptool

      - name: Generate face and voice assets
        working-directory: firmware/mochi_chronos
        run: python tools/generate_assets.py --force

      - name: Build default firmware
        working-directory: firmware/mochi_chronos
        run: pio run -e esp32-c3-supermini

      - name: Build audio-enabled firmware
        working-directory: firmware/mochi_chronos
        run: pio run -e esp32-c3-supermini-audio

      - name: Create merged flash image
        working-directory: firmware/mochi_chronos
        run: |
          esptool.py --chip esp32c3 merge_bin \
            --flash_mode dio \
            --flash_size 4MB \
            -o .pio/build/esp32-c3-supermini/merged-firmware.bin \
            0x0 .pio/build/esp32-c3-supermini/bootloader.bin \
            0x8000 .pio/build/esp32-c3-supermini/partitions.bin \
            0x10000 .pio/build/esp32-c3-supermini/firmware.bin

      - name: Package standardized firmware downloads
        env:
          BUILD_ID: ${{ inputs.build_id || '' }}
        run: |
          python tools/package_firmware.py \
            --variant mochi_chronos \
            --build-dir firmware/mochi_chronos/.pio/build/esp32-c3-supermini \
            --output-dir dist/mochi_chronos \
            --git-sha "$GITHUB_SHA" \\
            --build-id "$BUILD_ID"

      - name: Upload firmware package
        uses: actions/upload-artifact@v4
        with:
          name: neo-clock-mochi-chronos-${{ github.sha }}
          path: dist/mochi_chronos/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload audio-enabled experimental build
        uses: actions/upload-artifact@v4
        with:
          name: neo-clock-mochi-chronos-audio-experimental-${{ github.sha }}
          path: firmware/mochi_chronos/.pio/build/esp32-c3-supermini-audio/firmware.bin
          if-no-files-found: error
          retention-days: 30
