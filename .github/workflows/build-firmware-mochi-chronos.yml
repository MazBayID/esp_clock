name: Build Mochi Chronos Firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/mochi_chronos/**"
      - ".github/workflows/build-firmware-mochi-chronos.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/mochi_chronos/**"
      - ".github/workflows/build-firmware-mochi-chronos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install platformio pillow esptool

      - name: Generate face and voice assets
        working-directory: firmware/mochi_chronos
        run: python tools/generate_assets.py --force

      - name: Build default firmware
        working-directory: firmware/mochi_chronos
        run: pio run -e esp32-c3-supermini

      - name: Build audio-enabled firmware
        working-directory: firmware/mochi_chronos
        run: pio run -e esp32-c3-supermini-audio

      - name: Create merged flash image
        working-directory: firmware/mochi_chronos
        run: |
          esptool.py --chip esp32c3 merge_bin \
            --flash_mode dio \
            --flash_size 4MB \
            -o .pio/build/esp32-c3-supermini/merged-firmware.bin \
            0x0 .pio/build/esp32-c3-supermini/bootloader.bin \
            0x8000 .pio/build/esp32-c3-supermini/partitions.bin \
            0x10000 .pio/build/esp32-c3-supermini/firmware.bin

      - name: Upload standard firmware
        uses: actions/upload-artifact@v4
        with:
          name: mochi-chronos-firmware
          if-no-files-found: error
          path: |
            firmware/mochi_chronos/.pio/build/esp32-c3-supermini/firmware.bin
            firmware/mochi_chronos/.pio/build/esp32-c3-supermini/merged-firmware.bin

      - name: Upload audio-enabled firmware
        uses: actions/upload-artifact@v4
        with:
          name: mochi-chronos-audio-firmware
          if-no-files-found: error
          path: firmware/mochi_chronos/.pio/build/esp32-c3-supermini-audio/firmware.bin
