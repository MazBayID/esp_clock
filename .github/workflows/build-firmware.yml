name: Build Neo Firmware - via Wi-Fi

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neo-firmware-via-wifi-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-esp32-c3:
    name: Build via_wifi - ESP32-C3 SuperMini
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 platform
        run: |
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install Arduino libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "ArduinoJson"

      - name: Compile via_wifi firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3 \
            --warnings all \
            --output-dir build/via_wifi \
            firmware/via_wifi

      - name: Package firmware binaries
        run: |
          mkdir -p dist
          cp build/via_wifi/*.bin dist/
          cat > dist/FLASH-INSTRUCTIONS.txt <<'EOF'
          Neo Firmware - via Wi-Fi - ESP32-C3 SuperMini

          The archive contains the application binary and the ESP32 bootloader,
          partition table, and boot_app0 binaries generated by Arduino CLI.

          Default ESP32-C3 Arduino flash offsets:
            bootloader  : 0x0000
            partitions  : 0x8000
            boot_app0   : 0xE000
            application : 0x10000

          Use an ESP32 flashing tool and match each binary to its offset.
          Select the ESP32-C3 target and the serial port for your board.
          EOF
          cd dist
          zip -9 "../NeoFirmware-via-wifi-ESP32-C3-${GITHUB_SHA::7}.zip" ./*.bin FLASH-INSTRUCTIONS.txt

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoFirmware-via-wifi-ESP32-C3-${{ github.sha }}
          path: NeoFirmware-via-wifi-ESP32-C3-*.zip
          if-no-files-found: error
          retention-days: 30
